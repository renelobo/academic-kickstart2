# Netlify build (the GitHub Pages workflow in .github/workflows/ does not use this file).
# Keep HUGO_VERSION in sync with build.hugo_version in hugoblox.yaml.
[build]
  command = "hugo --gc --minify -b $URL && pnpm run pagefind"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.161.1"
  GO_VERSION = "1.24.7"
  NODE_VERSION = "22"
  PNPM_FLAGS = "--no-frozen-lockfile"
  HUGO_ENV = "production"

[context.deploy-preview]
  command = "hugo --gc --minify -b $DEPLOY_PRIME_URL && pnpm run pagefind"

[context.branch-deploy]
  command = "hugo --gc --minify -b $DEPLOY_PRIME_URL && pnpm run pagefind"
