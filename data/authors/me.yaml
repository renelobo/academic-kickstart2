bio: |
  I am a professor and researcher at Universidad Distrital Francisco José de
  Caldas in Bogotá, Colombia, where I work at the intersection of Artificial
  Intelligence, programming education and learning analytics. I received my
  PhD in Information and Communication Technologies from Universitat Pompeu
  Fabra (UPF) in 2023.

